name: Check website

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source filtering and site contracts
        run: python3 -m unittest discover -s tests -v
      - name: Check generated page is current
        run: python3 scripts/writing.py --check
