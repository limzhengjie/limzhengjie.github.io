name: Check website

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Test source filtering and site contracts
        run: python3 -m unittest discover -s tests -v
      - name: Check generated page is current
        run: python3 scripts/writing.py --check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Redis for counter persistence tests
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Check concurrent counter writes and persistence
        run: npm run test:counter
      - run: npx playwright install --with-deps chromium webkit
      - name: Check themes, navigation, enlarged text, and image viewing
        run: npm run test:browser
